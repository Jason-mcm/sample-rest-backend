quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:notes}
quarkus.datasource.password=${DB_PASSWORD:notes}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/notes}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/notes}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.swagger-ui.always-include=true
quarkus.http.limits.max-body-size=128K
quarkus.datasource.devservices.image-name=postgres:17
quarkus.smallrye-openapi.info-title=Team Notes API
quarkus.smallrye-openapi.info-version=1.0.0
